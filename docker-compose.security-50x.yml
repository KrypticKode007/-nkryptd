version: '3.8'

# Shared persistent configuration baselines across all 50 isolated layers
x-nkryptd-base: &nkryptd-base
  image: nkryptd:latest
  restart: always
  read_only: true
  security_opt:
    - apparmor=docker-nkryptd-policy
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev
  networks:
    - nkryptd_cluster_mesh

services:
  # TLS-Terminating Cluster Ingestion Reverse Proxy & Load Balancer
  nginx_loadbalancer:
    image: nginx:alpine
    container_name: nkryptd-cluster-lb
    restart: always
    ports:
      - "443:443"
    volumes:
      - ./nginx.loadbalancer.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - node_01
      - node_02
      - node_03
      - node_04
      - node_05
      - node_50 # Ensures backend stack initial mappings spin up prior to routing lines
    networks:
      - nkryptd_cluster_mesh

  # Hardened Processing Nodes (01 through 50)
  node_01:
    <<: *nkryptd-base
    container_name: nkryptd-monolith-01
    volumes: ["./data/node_01:/app/data:rw"]

  node_02:
    <<: *nkryptd-base
    container_name: nkryptd-monolith-02
    volumes: ["./data/node_02:/app/data:rw"]

  node_03:
    <<: *nkryptd-base
    container_name: nkryptd-monolith-03
    volumes: ["./data/node_03:/app/data:rw"]

