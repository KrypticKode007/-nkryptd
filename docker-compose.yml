services:
  nkryptd-core:
    build:
      context: .
      dockerfile: Dockerfile.nkryptd
    image: nkryptd:local
    container_name: nkryptd-sentinel-active
    restart: unless-stopped
    environment:
      NKRYPTD_DATA_DIR: /data
      NKRYPTD_HOST: 0.0.0.0
      NKRYPTD_PORT: 8080
    volumes:
      - nkryptd-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [nkryptd]

  nkryptd-actuator:
    image: nkryptd:local
    container_name: nkryptd-actuator-9999
    restart: unless-stopped
    command: ["python", "kryptic_9999_actuator.py"]
    environment:
      NKRYPTD_DATA_DIR: /data
      NKRYPTD_WORKERS: 8
      NKRYPTD_ACTUATOR_HOST: 0.0.0.0
      NKRYPTD_ACTUATOR_PORT: 8081
    volumes:
      - nkryptd-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      nkryptd-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [nkryptd]

  nkryptd-gateway:
    image: nkryptd:local
    container_name: nkryptd-gateway-incognito
    restart: unless-stopped
    command: ["python", "kryptic_websocket_gateway.py"]
    environment:
      NKRYPTD_DATA_DIR: /data
      NKRYPTD_GATEWAY_HOST: 0.0.0.0
      NKRYPTD_GATEWAY_PORT: 19999
      NKRYPTD_GATEWAY_TOKEN: ${NKRYPTD_GATEWAY_TOKEN:?Set NKRYPTD_GATEWAY_TOKEN in .env}
    volumes:
      - nkryptd-data:/data
    ports:
      - "19999:19999"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',19999),timeout=2); s.close()"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      nkryptd-core:
        condition: service_healthy
    networks: [nkryptd]

volumes:
  nkryptd-data:

networks:
  nkryptd:
    driver: bridge
