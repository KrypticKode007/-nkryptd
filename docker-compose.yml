version: '3.8'

services:
  allergic_monolith:
    build:
      context: .
      dockerfile: Dockerfile.nkryptd
    container_name: nkryptd-secure-monolith
    restart: always
    read_only: true # Enforce a completely read-only root system inside container layers
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev # Limit memory writes to low-privilege transient mount points
    security_opt:
      - no-new-privileges:true # Lock down process state from pivoting to elevated execution paths
    cap_drop:
      - ALL # Drop all default Linux kernel capabilities completely
    cap_add:
      - NET_BIND_SERVICE # Allow binding to structural ports safely if scaled down
    volumes:
      - ./data:/app/data:rw # Isolate ledger database updates to a dedicated volume slice
    ports:
      - "8080:8080"
      
