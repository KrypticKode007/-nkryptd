events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Secure TLS Defaults
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # Route Core Daemon & Gateway
    server {
        listen 443 ssl http2;
        server_name localhost;

        # Target TLS Certificates (Mount into container)
        ssl_certificate     /etc/nginx/certs/nkryptd.crt;
        ssl_certificate_key /etc/nginx/certs/nkryptd.key;

        # HTTP Core Daemon Endpoint
        location /v1/events {
            proxy_pass http://headless_daemon:8080/v1/events;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket Incognito Gateway
        location / {
            proxy_pass http://incognito_gateway:19999;
            proxy_http_version 1.1;
            
            # Necessary Upgrade Headers for WebSockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400; # Keep connections persistent
        }
    }
}
